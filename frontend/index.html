<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corvus HR &amp; Payroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<style>
  :root{
    --navy-950:#0A0F26;
    --navy-900:#10193A;
    --navy-800:#182451;
    --navy-700:#233069;
    --blue-500:#1E5EFF;
    --blue-400:#4B7CFF;
    --blue-100:#E7EDFF;
    --paper:#F6F7FB;
    --card:#FFFFFF;
    --ink-900:#151A2E;
    --ink-600:#4B5568;
    --ink-400:#8890A6;
    --line:#E6E8F0;
    --green:#1F9D6C;
    --green-bg:#E8F7F0;
    --amber:#C9821A;
    --amber-bg:#FCF2E0;
    --red:#D9432E;
    --red-bg:#FBEAE7;
    --violet:#6E4CD9;
    --violet-bg:#EFEAFC;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,25,58,.04), 0 8px 24px -12px rgba(16,25,58,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--paper);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--blue-100);}

  /* ---------- Layout ---------- */
  #app{display:flex; min-height:100vh;}

  /* Sidebar */
  .sidebar{
    width:248px; flex:0 0 248px;
    background:linear-gradient(180deg, var(--navy-900), var(--navy-950));
    color:#fff; display:flex; flex-direction:column;
    position:sticky; top:0; height:100vh;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:22px 20px 18px 20px;}
  .brand img{width:30px; height:30px; display:block;}
  .brand .name{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:17px; letter-spacing:.2px;}
  .brand .sub{font-size:10.5px; color:#8FA0D6; letter-spacing:.14em; text-transform:uppercase; margin-top:1px;}
  .brand-text{line-height:1.25;}

  .nav{padding:10px 12px; flex:1; overflow-y:auto;}
  .nav-group-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.12em; color:#5F6D9E; padding:16px 12px 6px;}
  .nav-item{
    display:flex; align-items:center; gap:11px;
    padding:9px 12px; border-radius:9px; margin-bottom:2px;
    color:#C4CCEA; font-size:13.5px; font-weight:500; cursor:pointer;
    border:1px solid transparent; position:relative;
  }
  .nav-item svg{width:17px; height:17px; flex:0 0 17px; opacity:.85;}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff;}
  .nav-item.active{background:var(--navy-800); color:#fff; box-shadow: inset 3px 0 0 var(--blue-400);}
  .nav-item .badge{margin-left:auto; background:var(--blue-500); color:#fff; font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:99px;}

  .sidebar-foot{padding:14px; border-top:1px solid rgba(255,255,255,.08);}
  .role-switch{background:var(--navy-800); border-radius:10px; padding:8px 10px; font-size:11.5px; color:#9AA6D0;}
  .role-switch select{
    width:100%; margin-top:5px; background:var(--navy-950); color:#fff; border:1px solid var(--navy-700);
    border-radius:7px; padding:6px 8px; font-size:12.5px; font-family:inherit;
  }

  /* Main */
  .main{flex:1; min-width:0; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; gap:16px;
    padding:16px 28px; border-bottom:1px solid var(--line);
    background:rgba(246,247,251,.9); backdrop-filter:blur(6px);
    position:sticky; top:0; z-index:5;
  }
  .topbar h1{font-size:19px; margin:0; font-weight:600;}
  .topbar .subtitle{font-size:12.5px; color:var(--ink-400); margin-top:1px;}
  .search-box{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background:#fff; border:1px solid var(--line); border-radius:10px;
    padding:8px 12px; width:260px; color:var(--ink-400);
  }
  .search-box input{border:none; outline:none; font-size:13px; width:100%; font-family:inherit; color:var(--ink-900);}
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    border-radius:9px; border:1px solid var(--line); background:#fff;
    padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; color:var(--ink-900);
    transition:.12s;
  }
  .btn:hover{border-color:#C8D0EA; background:#FAFBFF;}
  .btn-primary{background:var(--navy-900); color:#fff; border-color:var(--navy-900);}
  .btn-primary:hover{background:var(--blue-500); border-color:var(--blue-500);}
  .btn-danger{color:var(--red); border-color:var(--red-bg);}
  .btn-danger:hover{background:var(--red-bg);}
  .btn-sm{padding:5px 10px; font-size:12px; border-radius:7px;}
  .btn svg{width:15px; height:15px;}

  .content{padding:24px 28px 60px; flex:1;}

  /* Cards / grid */
  .grid{display:grid; gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:2fr 1fr;}
  @media (max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-2{grid-template-columns:1fr;}}

  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px;
  }
  .card-notch{ clip-path: polygon(0 0, calc(100% - 18px) 0, 100% 18px, 100% 100%, 0 100%); }
  .card h3{margin:0 0 4px; font-size:13px; color:var(--ink-600); font-weight:600;}
  .kpi-val{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; margin-top:6px;}
  .kpi-sub{font-size:12px; color:var(--ink-400); margin-top:6px;}
  .kpi-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
  .kpi-icon svg{width:18px;height:18px;}

  .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600;}
  .pill-green{background:var(--green-bg); color:var(--green);}
  .pill-amber{background:var(--amber-bg); color:var(--amber);}
  .pill-red{background:var(--red-bg); color:var(--red);}
  .pill-blue{background:var(--blue-100); color:var(--blue-500);}
  .pill-violet{background:var(--violet-bg); color:var(--violet);}
  .pill-gray{background:#EEF0F6; color:var(--ink-600);}

  /* Table */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-400); font-weight:600; padding:10px 12px; border-bottom:1px solid var(--line);
    white-space:nowrap;
  }
  td{padding:12px; border-bottom:1px solid #F0F1F6; vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#FAFBFF;}
  .row-name{font-weight:600;}
  .row-sub{font-size:12px; color:var(--ink-400);}
  .avatar{
    width:30px; height:30px; border-radius:8px; background:var(--navy-900); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;
    font-family:'Space Grotesk',sans-serif; flex:0 0 30px;
  }
  .flex-row{display:flex; align-items:center; gap:10px;}
  .table-wrap{overflow-x:auto;}
  .actions-cell{display:flex; gap:6px; justify-content:flex-end;}
  .icon-btn{
    width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-600);
  }
  .icon-btn:hover{background:#F3F4F9;}
  .icon-btn svg{width:14px;height:14px;}

  .section-head{display:flex; align-items:center; margin-bottom:14px; gap:12px;}
  .section-head h2{font-size:16px; margin:0; font-weight:600;}
  .section-head .count{color:var(--ink-400); font-size:12.5px; font-weight:500;}
  .section-head .spacer{flex:1;}

  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .toolbar select, .filter-input{
    border:1px solid var(--line); border-radius:9px; padding:7px 10px; font-size:12.5px; font-family:inherit;
    background:#fff; color:var(--ink-900);
  }

  .empty-state{text-align:center; padding:50px 20px; color:var(--ink-400);}
  .empty-state svg{width:40px;height:40px;opacity:.4;margin-bottom:10px;}
  .empty-state .e-title{color:var(--ink-600); font-weight:600; font-size:14px; margin-bottom:4px;}

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,15,38,.45); display:none;
    align-items:center; justify-content:center; z-index:50; padding:20px;
    backdrop-filter:blur(2px);
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:#fff; border-radius:16px; width:100%; max-width:560px; max-height:88vh;
    overflow-y:auto; box-shadow:0 20px 60px rgba(10,15,38,.3);
  }
  .modal-head{display:flex; align-items:center; padding:18px 22px; border-bottom:1px solid var(--line);}
  .modal-head h3{margin:0; font-size:16px;}
  .modal-body{padding:20px 22px;}
  .modal-foot{padding:16px 22px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px;}
  .close-x{margin-left:auto; cursor:pointer; width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:7px; color:var(--ink-400);}
  .close-x:hover{background:#F3F4F9;}

  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; font-weight:600; color:var(--ink-600); margin-bottom:5px;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); border-radius:9px; padding:9px 11px;
    font-size:13.5px; font-family:inherit; background:#fff; color:var(--ink-900);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--blue-400); box-shadow:0 0 0 3px var(--blue-100);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .hint{font-size:11px; color:var(--ink-400); margin-top:4px;}

  /* Toast */
  .toast-wrap{position:fixed; bottom:20px; right:20px; z-index:100; display:flex; flex-direction:column; gap:8px;}
  .toast{
    background:var(--navy-950); color:#fff; padding:11px 16px; border-radius:10px; font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.25); display:flex; align-items:center; gap:8px;
    animation:slideIn .25s ease;
  }
  .toast.success{background:var(--green);}
  .toast.error{background:var(--red);}
  @keyframes slideIn{from{transform:translateY(8px); opacity:0;} to{transform:translateY(0); opacity:1;}}

  /* Bars / progress */
  .bar-track{background:#EEF0F6; border-radius:99px; height:6px; overflow:hidden;}
  .bar-fill{height:100%; border-radius:99px; background:var(--blue-500);}

  .tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px;}
  .tab{padding:9px 4px; margin-right:18px; font-size:13.5px; font-weight:600; color:var(--ink-400); cursor:pointer; border-bottom:2px solid transparent;}
  .tab.active{color:var(--navy-900); border-bottom-color:var(--blue-500);}

  .type-dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px;}
  .dot-full{background:var(--blue-500);} .dot-part{background:var(--violet);} .dot-intern{background:var(--amber);}

  .login-screen{min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy-950); position:relative; overflow:hidden;}
  .login-screen:before{content:"";position:absolute; width:600px; height:600px; background:radial-gradient(circle, rgba(30,94,255,.25), transparent 70%); top:-200px; right:-150px;}
  .login-card{background:#fff; border-radius:18px; padding:36px 36px 30px; width:380px; box-shadow:0 30px 80px rgba(0,0,0,.4); position:relative; z-index:2;}
  .login-card img{width:44px; margin-bottom:14px;}
  .login-card h2{margin:0 0 4px; font-size:20px;}
  .login-card p{margin:0 0 22px; color:var(--ink-400); font-size:13px;}
  .role-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px;}
  .role-opt{border:1.5px solid var(--line); border-radius:11px; padding:12px; cursor:pointer; text-align:center; font-size:12.5px; font-weight:600;}
  .role-opt:hover{border-color:var(--blue-400); background:var(--blue-100);}
  .role-opt.selected{border-color:var(--blue-500); background:var(--blue-100); color:var(--blue-500);}

  .scrollbar-thin::-webkit-scrollbar{width:7px; height:7px;}
  .scrollbar-thin::-webkit-scrollbar-thumb{background:#C8CEE0; border-radius:99px;}

  .storage-note{font-size:11.5px; color:var(--ink-400); background:#fff; border:1px dashed var(--line); border-radius:10px; padding:8px 12px; margin-bottom:16px;}
</style>
</head>

// Low-level fetch helper: attaches the signed-in user's ID token and
// (for company-scoped routes) prefixes /companies/:companyId automatically.
async function apiFetch(path, { method = 'GET', body, scoped = true } = {}){
  const user = fbAuth.currentUser;
  const headers = { 'Content-Type': 'application/json' };
  if(user){ headers['Authorization'] = 'Bearer ' + (await user.getIdToken()); }
  const url = API_BASE + (scoped ? `/companies/${STATE.companyId}${path}` : path);
  const res = await fetch(url, { method, headers, body: body!==undefined ? JSON.stringify(body) : undefined });
  if(res.status === 204) return null;
  const data = await res.json().catch(()=>null);
  if(!res.ok) throw new Error((data && data.error && (data.error.formErrors?.join(', ') || data.error)) || `Request failed (${res.status})`);
  return data;
}

// Loads every collection for the signed-in user's company from the backend.
async function loadAll(){
  const [employees, departments, attendance, leaves, resources, payrollRuns, settings] = await Promise.all([
    apiFetch('/employees'),
    apiFetch('/departments'),
    apiFetch('/attendance'),
    apiFetch('/leaves'),

    apiFetch('/payroll/history').catch(()=>[]), // manager/admin only
    apiFetch('/settings'),
  ]);
  STATE.employees = employees || [];
  STATE.departments = departments || [];
  STATE.attendance = attendance || [];
  STATE.leaves = leaves || [];
  STATE.resources = resources || [];
  STATE.payrollRuns = payrollRuns || [];
  STATE.settings = settings || STATE.settings;
}

// ---------- Payroll calculation ----------
function overtimeHourlyRate(emp){
  const s = STATE.settings;
  const base = emp.payType==='hourly' ? emp.hourlyRate : (emp.baseSalary / (s.workingDaysPerMonth * s.standardHoursPerDay));
  return base * s.overtimeMultiplier;
}
function computePayrollForMonth(month){
  const s = STATE.settings;
  return STATE.employees.filter(e=>e.status==='active').map(emp=>{
    const records = STATE.attendance.filter(a=>a.employeeId===emp.id && a.date.startsWith(month));
    const overtimeHours = records.reduce((t,r)=>t+(r.overtimeHours||0),0);
    const hoursWorked = records.reduce((t,r)=>t+(r.hoursWorked||0),0);
    let base;
    if(emp.payType==='hourly'){ base = hoursWorked * emp.hourlyRate; }
    else{ base = emp.baseSalary; }
    const overtimePay = overtimeHours * overtimeHourlyRate(emp);
    const unpaidLeaveDays = STATE.leaves.filter(l=>l.employeeId===emp.id && l.type==='unpaid' && l.status==='approved' && l.from.startsWith(month)).reduce((t,l)=>t+l.days,0);
    const deductions = emp.payType==='salary' ? Math.round((emp.baseSalary / s.workingDaysPerMonth) * unpaidLeaveDays * 100)/100 : 0;
    const net = Math.max(0, base + overtimePay - deductions);
    return {employeeId:emp.id, name:emp.name, department:emp.department, type:emp.type, base:Math.round(base*100)/100, overtimeHours, overtimePay:Math.round(overtimePay*100)/100, deductions, net:Math.round(net*100)/100};
  });
}

// ---------- Toast ----------
function toast(msg, type=''){
  const el = document.createElement('div');
  el.className = 'toast '+type;

  setTimeout(()=>el.remove(), 3200);
}

function donutChart(byType){
  const total = byType.full+byType.part+byType.intern || 1;
  const data = [ {v:byType.full,c:'var(--blue-500)',label:'Full-time'}, {v:byType.part,c:'var(--violet)',label:'Part-time'}, {v:byType.intern,c:'var(--amber)',label:'Intern'} ];
  let acc = 0;
  const r = 52, cx=64, cy=64, circ = 2*Math.PI*r;
  const segs = data.map(d=>{
    const frac = d.v/total;
    const dash = frac*circ;
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${d.c}" stroke-width="16" stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${-acc}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc += dash;
    return seg;
  }).join('');
  return `
  <div style="display:flex; align-items:center; gap:24px;">
    <svg width="128" height="128" viewBox="0 0 128 128">${segs}</svg>
    <div style="display:flex; flex-direction:column; gap:10px;">
      ${data.map(d=>`<div class="flex-row" style="font-size:13px;"><span style="width:10px;height:10px;border-radius:3px;background:${d.c};display:inline-block;"></span> ${d.label} <span class="mono" style="color:var(--ink-400);">(${d.v})</span></div>`).join('')}
    </div>
  </div>`;
}

function statusPill(status){
  const map = {pending:['pill-amber','Pending'], approved:['pill-green','Approved'], rejected:['pill-red','Rejected'], active:['pill-green','Active'], inactive:['pill-gray','Inactive'], assigned:['pill-blue','Assigned'], available:['pill-green','Available'], maintenance:['pill-amber','Maintenance'], retired:['pill-gray','Retired']};
  const [cls,label] = map[status] || ['pill-gray', status];
  return `<span class="pill ${cls}">${label}</span>`;
}
function typePill(type){
  const map = {'full-time':['dot-full','Full-time'], 'part-time':['dot-part','Part-time'], 'intern':['dot-intern','Intern']};
  const [dot,label] = map[type] || ['dot-full', type];
  return `<span class="pill pill-gray"><span class="type-dot ${dot}"></span>${label}</span>`;
}
function emptyState(msg, sub=''){
  return `<div class="empty-state">${ICONS.empty}<div class="e-title">${msg}</div><div>${sub}</div></div>`;
}

async function attachRouteHandlers(route){
  document.querySelectorAll('[data-route-link]').forEach(el=>el.addEventListener('click', ()=>{ STATE.route = el.dataset.routeLink; render(); }));

  if(route==='employees'){
    document.getElementById('add-employee-btn').addEventListener('click', ()=>{
      openModal(employeeFormModal(null)); bindEmployeeForm(null);
    });
    document.querySelectorAll('[data-edit-emp]').forEach(el=>el.addEventListener('click', ()=>{
      const emp = STATE.employees.find(x=>x.id===el.dataset.editEmp);
      openModal(employeeFormModal(emp)); bindEmployeeForm(emp);
    }));
    document.querySelectorAll('[data-del-emp]').forEach(el=>el.addEventListener('click', async ()=>{
      if(!confirm('Remove this employee? This cannot be undone.')) return;
      try{
        await apiFetch(`/employees/${el.dataset.delEmp}`, { method:'DELETE' });
        STATE.employees = STATE.employees.filter(x=>x.id!==el.dataset.delEmp);
        toast('Employee removed','success'); render();
      }catch(err){ toast(err.message,'error'); }
    }));
    const applyFilters = ()=>{
      const t = document.getElementById('filter-type').value, d = document.getElementById('filter-dept').value;
      document.querySelectorAll('#emp-tbody tr[data-emp]').forEach(tr=>{
        const emp = STATE.employees.find(x=>x.id===tr.dataset.emp);
        const show = (!t||emp.type===t) && (!d||emp.department===d);
        tr.style.display = show ? '' : 'none';
      });
    };
    document.getElementById('filter-type').addEventListener('change', applyFilters);
    document.getElementById('filter-dept').addEventListener('change', applyFilters);
  }

  if(route==='attendance'){ bindAttendanceHandlers(); }
  if(route==='leave'){ bindLeaveHandlers(); }
  if(route==='payroll'){ bindPayrollHandlers(); }
  if(route==='resources'){ bindResourceHandlers(); }
  if(route==='departments'){ bindDepartmentHandlers(); }
  if(route==='settings'){ bindSettingsHandlers(); }
}

    <div class="card"><h3>Total net pay</h3><div class="kpi-val">${fmtMoney(totalNet)}</div></div>
  </div>
  <div class="card" style="padding:0; margin-bottom:20px;">
    <div class="table-wrap"><table>
      <thead><tr><th>Employee</th><th>Type</th><th>Base</th><th>Overtime</th><th>Deductions</th><th>Net pay</th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6">${emptyState('No active employees to pay')}</td></tr>`}</tbody>
    </table></div>
  </div>
  <div class="section-head"><h2>Payroll history</h2></div>
  <div class="card">${history || emptyState('No payroll runs yet','Run payroll above to generate the first record.')}</div>
  `;
}
function bindPayrollHandlers(){
  const month = monthKey();
  document.getElementById('run-payroll').addEventListener('click', async ()=>{
    try{
      const run = await apiFetch('/payroll/run', { method:'POST', body:{ month } });
      const existingIdx = STATE.payrollRuns.findIndex(r=>r.month===month);
      if(existingIdx>=0) STATE.payrollRuns[existingIdx] = run; else STATE.payrollRuns.push(run);
      toast(`Payroll run recorded for ${month}`,'success'); render();
    }catch(err){ toast(err.message,'error'); }
  });
  document.getElementById('export-payroll').addEventListener('click', ()=>{
    const draft = computePayrollForMonth(month);
    let csv = 'Employee,Type,Base,Overtime Hours,Overtime Pay,Deductions,Net Pay\n';
    draft.forEach(p=>{ csv += `"${p.name}",${p.type},${p.base},${p.overtimeHours},${p.overtimePay},${p.deductions},${p.net}\n`; });
    const blob = new Blob([csv], {type:'text/csv'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `payroll-${month}.csv`; a.click();
    URL.revokeObjectURL(url);
  });
}

      <td style="text-transform:capitalize;">${r.category}</td>

      <td class="mono">${fmtDate(r.purchaseDate)}</td>
      <td class="actions-cell"><div class="icon-btn" data-edit-res="${r.id}">${ICONS.edit}</div><div class="icon-btn" data-del-res="${r.id}">${ICONS.trash}</div></td>
    </tr>`;
  }).join('');

  <div class="card" style="padding:0;">
    <div class="table-wrap"><table>
      <thead><tr><th>Asset</th><th>Category</th><th>Assigned to</th><th>Status</th><th>Purchased</th><th></th></tr></thead>

function resourceFormModal(existing){
  const r = existing || {id:null, name:'', category:'laptop', serial:'', assignedTo:'', status:'available', purchaseDate:todayISO()};
  return `
  <div class="modal-head"><h3>${existing?'Edit asset':'Add asset'}</h3><div class="close-x" id="modal-close">${ICONS.x}</div></div>
  <div class="modal-body">
    <div class="field"><label>Asset name</label><input id="r-name" value="${r.name}" placeholder="e.g. ThinkPad X1"></div>
    <div class="field-row">
      <div class="field"><label>Category</label><select id="r-cat"><option value="laptop" ${r.category==='laptop'?'selected':''}>Laptop</option><option value="monitor" ${r.category==='monitor'?'selected':''}>Monitor</option><option value="phone" ${r.category==='phone'?'selected':''}>Phone</option><option value="furniture" ${r.category==='furniture'?'selected':''}>Furniture</option><option value="other" ${r.category==='other'?'selected':''}>Other</option></select></div>
      <div class="field"><label>Serial / tag</label><input id="r-serial" value="${r.serial}" placeholder="e.g. AB-1234"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Assigned to</label><select id="r-assigned"><option value="">Unassigned</option>${STATE.employees.map(e=>`<option value="${e.id}" ${e.id===r.assignedTo?'selected':''}>${e.name}</option>`).join('')}</select></div>
      <div class="field"><label>Status</label><select id="r-status"><option value="available" ${r.status==='available'?'selected':''}>Available</option><option value="assigned" ${r.status==='assigned'?'selected':''}>Assigned</option><option value="maintenance" ${r.status==='maintenance'?'selected':''}>Maintenance</option><option value="retired" ${r.status==='retired'?'selected':''}>Retired</option></select></div>
    </div>
    <div class="field"><label>Purchase date</label><input id="r-date" type="date" value="${r.purchaseDate}"></div>
  </div>
  <div class="modal-foot"><button class="btn" id="modal-cancel">Cancel</button><button class="btn btn-primary" id="modal-save">${existing?'Save changes':'Add asset'}</button></div>`;
}
function bindResourceHandlers(){
  document.getElementById('add-resource-btn').addEventListener('click', ()=>{ openModal(resourceFormModal(null)); bindResourceForm(null); });
  document.querySelectorAll('[data-edit-res]').forEach(el=>el.addEventListener('click', ()=>{
    const r = STATE.resources.find(x=>x.id===el.dataset.editRes); openModal(resourceFormModal(r)); bindResourceForm(r);
  }));
  document.querySelectorAll('[data-del-res]').forEach(el=>el.addEventListener('click', async ()=>{
    try{
      const id = el.dataset.delRes;
      await apiFetch(`/resources/${id}`, { method:'DELETE' });
      STATE.resources = STATE.resources.filter(x=>x.id!==id);
      toast('Asset removed'); render();
    }catch(err){ toast(err.message,'error'); }
  }));
}
function bindResourceForm(existing){
  document.getElementById('modal-close').addEventListener('click', closeModal);
  document.getElementById('modal-cancel').addEventListener('click', closeModal);
  document.getElementById('modal-save').addEventListener('click', async ()=>{
    const payload = {
      name: document.getElementById('r-name').value.trim(),
      category: document.getElementById('r-cat').value,
      serial: document.getElementById('r-serial').value.trim(),
      assignedTo: document.getElementById('r-assigned').value || null,
      status: document.getElementById('r-status').value,
      purchaseDate: document.getElementById('r-date').value || todayISO(),
    };
    if(!payload.name){ toast('Asset name required','error'); return; }
    try{
      if(existing){
        await apiFetch(`/resources/${existing.id}`, { method:'PUT', body: payload });
        STATE.resources = STATE.resources.map(x=>x.id===existing.id?{id:existing.id, ...payload}:x);
      }else{
        const created = await apiFetch('/resources', { method:'POST', body: payload });
        STATE.resources.push(created);
      }
      closeModal(); toast(existing?'Asset updated':'Asset added','success'); render();
    }catch(err){ toast(err.message,'error'); }
  });
}

// ===================== REPORTS =====================
function renderReports(){
  const months = [];
  const now = new Date();
  for(let i=5;i>=0;i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(monthKey(d)); }
  const costs = months.map(m=>{
    const run = STATE.payrollRuns.find(r=>r.month===m);
    if(run) return run.entries.reduce((t,e)=>t+e.net,0);
    return m===monthKey() ? computePayrollForMonth(m).reduce((t,p)=>t+p.net,0) : 0;
  });
  const max = Math.max(...costs, 1);
  const bars = months.map((m,i)=>`
    <div style="display:flex; flex-direction:column; align-items:center; gap:6px; flex:1;">
      <div class="mono" style="font-size:10.5px; color:var(--ink-400);">${fmtMoney(costs[i]).replace(/\.00$/,'')}</div>
      <div style="width:100%; max-width:36px; height:140px; display:flex; align-items:flex-end;">
        <div style="width:100%; border-radius:6px 6px 0 0; background:linear-gradient(180deg, var(--blue-400), var(--blue-500)); height:${Math.max(4,(costs[i]/max*140))}px;"></div>
      </div>
      <div style="font-size:11px; color:var(--ink-400);">${m.slice(5)}/${m.slice(2,4)}</div>
    </div>`).join('');

  const depCounts = STATE.departments.map(d=>({name:d.name, n: STATE.employees.filter(e=>e.department===d.id && e.status==='active').length}));
  const maxDep = Math.max(...depCounts.map(d=>d.n), 1);

  return `
  <div class="grid grid-2">
    <div class="card">
      <div class="section-head"><h2>Payroll cost trend</h2></div>
      <div style="display:flex; gap:8px; align-items:flex-end;">${bars}</div>
    </div>
    <div class="card">
      <div class="section-head"><h2>Headcount by department</h2></div>
      ${depCounts.map(d=>`
        <div style="margin-bottom:12px;">
          <div class="flex-row" style="justify-content:space-between; font-size:12.5px; margin-bottom:5px;"><span>${d.name}</span><span class="mono">${d.n}</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${d.n/maxDep*100}%; background:var(--violet);"></div></div>
        </div>`).join('') || emptyState('No departments')}
    </div>
  </div>`;
}

// ===================== Login / bootstrap (Firebase Auth) =====================
let signupMode = false; // false = sign in existing user, true = create account + new company

function setLoginError(msg){
  const box = document.getElementById('login-error');
  if(!msg){ box.style.display = 'none'; box.textContent=''; return; }
  box.style.display = 'block'; box.textContent = msg;
}

function wireLoginScreen(){
  document.getElementById('mode-toggle').addEventListener('click', (e)=>{
    e.preventDefault();
    signupMode = !signupMode;
    document.getElementById('signup-company-field').style.display = signupMode ? '' : 'none';
    document.getElementById('login-btn').textContent = signupMode ? 'Create account' : 'Sign in';
    document.getElementById('mode-toggle-text').textContent = signupMode ? 'Already have an account?' : 'New company?';
    document.getElementById('mode-toggle').textContent = signupMode ? 'Sign in' : 'Create one';
    setLoginError(null);
  });

  document.getElementById('login-btn').addEventListener('click', async ()=>{
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if(!email || !password){ setLoginError('Enter an email and password.'); return; }
    setLoginError(null);
    try{
      if(signupMode){
        const companyName = document.getElementById('signup-company').value.trim();
        if(!companyName){ setLoginError('Enter a company name.'); return; }
        const cred = await fbAuth.createUserWithEmailAndPassword(email, password);
        const idToken = await cred.user.getIdToken();
        const res = await fetch(`${API_BASE}/signup`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+idToken },
          body: JSON.stringify({ companyName }),
        });
        if(!res.ok) throw new Error((await res.json().catch(()=>({}))).error || 'Signup failed');
      }else{
        await fbAuth.signInWithEmailAndPassword(email, password);
      }
      // onAuthStateChanged below picks up the rest (fetching /me, loading data, showing the app)
    }catch(err){ setLoginError(err.message); }
  });
}

document.getElementById('signout-btn').addEventListener('click', ()=> fbAuth.signOut());

fbAuth.onAuthStateChanged(async (user)=>{
  if(!user){
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    return;
  }
  try{
    const me = await apiFetch('/me', { scoped:false });
    STATE.currentUser = me.email;
    STATE.currentRole = me.role;
    STATE.companyId = me.companyId;
    await loadAll();
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('current-user-label').textContent = STATE.currentUser;
    document.getElementById('current-role-label').textContent = STATE.currentRole;
    render();
  }catch(err){
    // Signed in with Firebase but no /users profile yet (e.g. mid-signup) — surface it on the login screen.
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    setLoginError(err.message || 'Could not load your account. Try creating a company below.');
  }
});

wireLoginScreen();

document.getElementById('global-search').addEventListener('input', (e)=>{
  const q = e.target.value.toLowerCase();
  if(STATE.route!=='employees'){ STATE.route='employees'; render(); }
  setTimeout(()=>{
    document.querySelectorAll('#emp-tbody tr[data-emp]').forEach(tr=>{
      const emp = STATE.employees.find(x=>x.id===tr.dataset.emp);
      tr.style.display = emp.name.toLowerCase().includes(q) || emp.jobTitle.toLowerCase().includes(q) ? '' : 'none';
    });
  },0);
});
</script>
